# Copy to /etc/nginx/snippets/ and include it in the chess.tz server block:
#     include snippets/chess.tz-proxy.conf;
# in place of the `root` and `location /` lines that served the old static
# build. Keep the existing listen, server_name and ssl_* lines (Certbot's).

location / {
    limit_req zone=site burst=40 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Built assets have content hashes in their names, so browsers can keep them for a year.
location /_app/immutable/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
